<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Jaeyeon Kim — Log</title>
	<meta name="robots" content="noindex">
	<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicons/favicon-32x32.png">
	<style>
		@font-face {
			font-family: "suisse";
			src: url("../assets/webfont/SuisseIntl-Book-WebM.woff") format("woff");
			font-weight: 500;
			font-style: normal;
		}
		* { margin: 0; padding: 0; box-sizing: border-box; }
		html { font-size: 16px; }
		body {
			font-family: suisse, sans-serif;
			font-size: 1.5rem;
			font-weight: 500;
			line-height: 1.25;
			color: snow;
			background-color: black;
			cursor: default;
		}
		a {
			text-decoration: underline;
			color: inherit;
			cursor: pointer;
		}
		a:hover {
			animation: blink .8s step-start 0s infinite;
		}
		@keyframes blink {
			50% {
				color: #0a0a0a;
				background-color: white;
				border-radius: 2px;
				letter-spacing: -.1px;
			}
		}
		article {
			max-width: 600px;
			margin: 0.8rem 1.5rem 4rem;
		}
		.post { margin-bottom: 3rem; }
		.date {
			margin-bottom: .5rem;
		}
		.caption {
			padding-left: 3rem;
			margin-bottom: 1rem;
			white-space: pre-line;
		}
		.caption .ig-link {
			display: inline-block;
		}
		.post img {
			display: block;
			width: 100%;
			margin-bottom: .5rem;
		}
		.post .imgs { padding-left: 3rem; }
		@media only screen and (max-width: 600px) {
			html { font-size: 12px; }
		}
	</style>
</head>
<body>
<article>
	<p style="margin-bottom:2rem;"><a href="/">Jaeyeon Kim</a> — Log (draft)</p>
	<div id="feed"><p>Loading…</p></div>
</article>
<script>
	const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
	const fmtDate = ts => ts.slice(0, 10).replaceAll('-', '.') + '.';

	fetch('../data/instagram.json')
		.then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
		.then(({ posts }) => {
			document.getElementById('feed').innerHTML = posts.map(p => `
				<div class="post">
					<p class="date">${fmtDate(p.timestamp)}</p>
					<p class="caption">${esc(p.caption)} <a class="ig-link" href="${p.permalink}" target="_blank">↗</a></p>
					<div class="imgs">
						${p.images.map(im => `<img src="../data/${im.file}" loading="lazy" alt="">`).join('')}
					</div>
				</div>`).join('');
		})
		.catch(() => {
			document.getElementById('feed').innerHTML =
				'<p>No data yet — run the “Sync Instagram” workflow first.</p>';
		});
</script>
</body>
</html>
